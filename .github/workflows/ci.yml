name: ci
on:
  push:
    branches: [main]
  pull_request:

# OpenSSF Scorecard Token-Permissions: default the token to read-only; no job here needs more.
permissions: read-all

jobs:
  node:
    runs-on: ubuntu-latest
    # The verifier's Postgres envelope store is tested against a real database.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: verifier_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/verifier_test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  # The image Render deploys (render.yaml): build it on every PR so a missing file in the
  # Docker context fails here instead of in production.
  verifier-image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Build the verifier image
        run: docker build -f services/verifier/Dockerfile -t pactwright-verifier:ci .
      - name: Refuses to start without configuration
        run: |
          set +e
          out=$(docker run --rm pactwright-verifier:ci 2>&1); code=$?
          echo "$out"
          test "$code" -ne 0 && echo "$out" | grep -q "VERIFIER_SECRET_KEY is not set" \
            && echo "$out" | grep -q "DATABASE_URL is not set"
