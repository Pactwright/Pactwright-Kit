name: roadmap-check

# Every contribution must update ROADMAP.md (AGENTS.md §1).
on:
  pull_request:

# OpenSSF Scorecard Token-Permissions: this job only reads the diff.
permissions:
  contents: read

jobs:
  roadmap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - name: Require a ROADMAP.md change
        env:
          # Event payload data reaches the shell through an environment variable, never inline.
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          if git diff --name-only "$BASE_SHA"...HEAD | grep -qx 'ROADMAP.md'; then
            echo "ROADMAP.md updated."
          else
            echo "::error file=ROADMAP.md::Every contribution must update ROADMAP.md (task status, counts, Update log). See AGENTS.md §1."
            exit 1
          fi
