name: e2e-testnet
# Every MVP scenario in ARCHITECTURE §13 as real Stellar testnet transactions (ROADMAP K-16).
# The job summary is generated from the run's own report; nothing in it is hard-coded.
on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: e2e-testnet
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: pnpm/action-setup@fe02b34f77f8bc703788d5817da081398fad5dd2 # v4.0.0

      - uses: actions/setup-node@1d0ff469b7ec7b3cb9d8673fde0c81c44821de2a # v4.2.0
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run every scenario on testnet
        env:
          E2E_VERIFIER_SECRET: ${{ secrets.TESTNET_VERIFIER_SECRET }}
          # Hosted testnet facilitator with the `pact` scheme (render.yaml, ROADMAP L-08): runs the x402 rows.
          E2E_FACILITATOR_URL: ${{ vars.E2E_FACILITATOR_URL || 'https://pactwright-facilitator-testnet.onrender.com' }}
          E2E_FACILITATOR_API_KEY: ${{ secrets.E2E_FACILITATOR_API_KEY }}
        run: |
          test -n "$E2E_VERIFIER_SECRET" || { echo "TESTNET_VERIFIER_SECRET is not set"; exit 1; }
          pnpm e2e:testnet

      - name: Summary from the report
        if: always()
        run: |
          report=$(ls -t e2e/testnet/results/*.json 2>/dev/null | head -1)
          if [ -z "$report" ]; then echo "No report: the run failed before finishing." >> "$GITHUB_STEP_SUMMARY"; exit 0; fi
          {
            echo "### Testnet e2e"
            echo "| Scenario | Outcome | Step | Transaction |"
            echo "|---|---|---|---|"
            jq -r '.scenarios[] as $s | $s.steps | to_entries[] | "| \(if .key == 0 then $s.scenario else "" end) | \(if .key == 0 then $s.outcome else "" end) | \(.value.label) | [`\(.value.tx[0:8])…`](https://stellar.expert/explorer/testnet/tx/\(.value.tx)) |"' "$report"
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@4cec3d8aa04e39d1a68397de0c4cd6fb9dce8ec1 # v4.6.1
        if: always()
        with:
          name: e2e-testnet-report
          path: e2e/testnet/results/
          if-no-files-found: ignore
