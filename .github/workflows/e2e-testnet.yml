name: e2e-testnet
# In-memory scenario tests only; no chain access yet. The real testnet runner replaces this (ROADMAP K-16).
on:
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v3
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Run in-memory scenario tests
        run: pnpm vitest run test/e2e/
