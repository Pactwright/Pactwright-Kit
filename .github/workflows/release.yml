name: release
# changesets → npm (ROADMAP K-17)
on:
  push:
    branches:
      - main

concurrency: ${{ github.workflow }}-${{ github.ref }}

# OpenSSF Scorecard Token-Permissions: read-only by default. The release job below is the only one
# that raises it, and only to what a changesets publish needs: it commits the version bump
# (contents: write), attests provenance (id-token: write) and would push packages (packages: write).
permissions: read-all

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
          registry-url: "https://registry.npmjs.org"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build packages
        run: pnpm typecheck && pnpm build

      - name: Publish changesets
        run: |
          echo "Changeset publish with provenance enabled"
          # pnpm changeset publish --provenance
