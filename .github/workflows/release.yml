name: release
# changesets → npm (ROADMAP K-17)
on:
  push:
    branches:
      - main

concurrency: ${{ github.workflow }}-${{ github.ref }}

# OpenSSF Scorecard Token-Permissions: read-only by default. The release job below is the only one
# that raises it, and only to what a changesets publish needs: it commits the version bump
# (contents: write), attests provenance (id-token: write) and would push packages (packages: write).
permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
      id-token: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: pnpm/action-setup@fe02b34f77f8bc703788d5817da081398fad5dd2 # v4.0.0

      - uses: actions/setup-node@1d0ff469b7ec7b3cb9d8673fde0c81c44821de2a # v4.2.0
        with:
          node-version: 24
          registry-url: "https://registry.npmjs.org"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build packages
        run: pnpm typecheck && pnpm build

      - name: Publish changesets
        run: |
          echo "Changeset publish with provenance enabled"
          # pnpm changeset publish --provenance
