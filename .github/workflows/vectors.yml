name: vectors
# core hashing vs the pinned contracts release's test-vectors (ROADMAP K-03)
on:
  pull_request:

# OpenSSF Scorecard Token-Permissions: reads the repo, runs tests, needs no write.
permissions:
  contents: read

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@fe02b34f77f8bc703788d5817da081398fad5dd2 # v4.0.0
      - uses: actions/setup-node@1d0ff469b7ec7b3cb9d8673fde0c81c44821de2a # v4.2.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Verify vendored vectors match pinned commit (ROADMAP K-03, #124)
        run: |
          ref=$(tr -d '[:space:]' < packages/core/test/vectors/pactwright/COMMIT)
          ./scripts/fetch-vectors.sh "$ref"
          git diff --exit-code packages/core/test/vectors/pactwright/
      - run: pnpm test packages/core/test/vectors.test.ts
