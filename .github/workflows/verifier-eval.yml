name: verifier-eval
# Two checks (ROADMAP V-08, V-12):
# - rules: scores the rules on hand-written readings; cheap, runs on every PR.
# - real-model: runs the labelled documents through the configured model; costs money, so it runs
#   only on demand and weekly. Fails below 90% accuracy.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * 1"

# OpenSSF Scorecard Token-Permissions: reads the repo and posts artifacts; the real-model job
# authenticates to the model through secrets, not through the GITHUB_TOKEN.
permissions:
  contents: read

jobs:
  run:
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: pnpm/action-setup@fe02b34f77f8bc703788d5817da081398fad5dd2 # v4.0.0
      - uses: actions/setup-node@1d0ff469b7ec7b3cb9d8673fde0c81c44821de2a # v4.2.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm build
      - run: node services/verifier/eval/run.ts

  real-model:
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: verifier-eval
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: pnpm/action-setup@fe02b34f77f8bc703788d5817da081398fad5dd2 # v4.0.0
      - uses: actions/setup-node@1d0ff469b7ec7b3cb9d8673fde0c81c44821de2a # v4.2.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm build
      - name: Real-model eval
        env:
          VERIFIER_PROVIDER: ${{ vars.VERIFIER_PROVIDER }}
          VERIFIER_MODEL: ${{ vars.VERIFIER_MODEL }}
          VERIFIER_EFFORT: ${{ vars.VERIFIER_EFFORT }}
          LLM_BASE_URL: ${{ vars.LLM_BASE_URL }}
          VERIFIER_LLM_API_KEY: ${{ secrets.VERIFIER_LLM_API_KEY }}
          VERIFIER_MODEL_TIMEOUT_MS: ${{ vars.VERIFIER_MODEL_TIMEOUT_MS }}
          EVAL_CASE_DELAY_MS: ${{ vars.EVAL_CASE_DELAY_MS }}
        run: node services/verifier/eval/real/run.ts --out real-model-report.json
      - if: always()
        uses: actions/upload-artifact@4cec3d8aa04e39d1a68397de0c4cd6fb9dce8ec1 # v4.6.1
        with:
          name: real-model-report
          path: real-model-report.json
          if-no-files-found: ignore
